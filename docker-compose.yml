version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - AUDATEX_MOCK_MODE=${AUDATEX_MOCK_MODE:-false}
      - AUDATEX_VALUATION_ENDPOINT=${AUDATEX_VALUATION_ENDPOINT}
      - AUDATEX_VALUATION_SERVICE_ENDPOINT=${AUDATEX_VALUATION_SERVICE_ENDPOINT}
      - AUDATEX_VEHICLE_DATA_ENDPOINT=${AUDATEX_VEHICLE_DATA_ENDPOINT}
      - AUDATEX_CHE_ENDPOINT=${AUDATEX_CHE_ENDPOINT}
      - AUDATEX_CHE_USERNAME=${AUDATEX_CHE_USERNAME}
      - AUDATEX_CHE_PASSWORD=${AUDATEX_CHE_PASSWORD}
      - AUDATEX_CERTIFICATE_HASH=${AUDATEX_CERTIFICATE_HASH}
      - AUDATEX_LICENCE_NUMBER=${AUDATEX_LICENCE_NUMBER}
      - AUDATEX_MARKET_CODE=${AUDATEX_MARKET_CODE:-PL}
      - AUDATEX_LANGUAGE=${AUDATEX_LANGUAGE:-PL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/auth/me', (r) => process.exit(r.statusCode === 401 || r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.izzycheck.rule=Host(`cool.izzycars.pl`)"
      - "traefik.http.routers.izzycheck.entrypoints=https"
      - "traefik.http.routers.izzycheck.tls=true"
      - "traefik.http.routers.izzycheck.tls.certresolver=letsencrypt"
      - "traefik.http.services.izzycheck.loadbalancer.server.port=3000"
    networks:
      - default
      - coolify

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-izzycheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-izzycheck}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-izzycheck} -d ${POSTGRES_DB:-izzycheck}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

volumes:
  postgres_data:

networks:
  coolify:
    external: true
