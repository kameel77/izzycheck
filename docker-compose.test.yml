services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: izzy
      POSTGRES_PASSWORD: izzy
      POSTGRES_DB: izzycheck_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U izzy -d izzycheck_test"]
      interval: 1s
      timeout: 3s
      retries: 30
